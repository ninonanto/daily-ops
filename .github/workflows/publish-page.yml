name: Publish page from Google Drive (one-time setup)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download index.html
        run: |
          curl -sSL "https://script.google.com/macros/s/AKfycbwP-wyebInmGaMy3DIOhYPPdQD0a1eIA5NiEtfgmWS5-Kt2de0QLjO-ql9H0rsbG_prCA/exec?file=index" -o index.html
          head -c 15 index.html | grep -q "<!DOCTYPE html>"
          wc -c index.html
      - name: Commit
        run: |
          git config user.name "ninonanto"
          git config user.email "ninonanto@users.noreply.github.com"
          git add index.html
          git commit -m "Add Daily Operation Record page"
          git push
